name: web-quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: environment/requirements-web.lock.txt

      - name: Install Web runtime
        run: python -m pip install --requirement environment/requirements-web.lock.txt

      - name: Run offline deployment preflight
        run: python scripts/deployment_preflight.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q app scripts tests

      - name: Check Streamlit health endpoint
        run: |
          python -m streamlit run app/streamlit_app.py --server.address=127.0.0.1 --server.port=8501 --server.fileWatcherType=none > streamlit.log 2>&1 &
          python scripts/check_streamlit_health.py

      - name: Build deployment image
        run: docker build --tag watershed-webgis:test .
